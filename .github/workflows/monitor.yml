name: Chrome Hearts Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # runs roughly every 15 minutes
  workflow_dispatch:          # lets you also trigger it manually to test

permissions:
  contents: write

jobs:
  check-for-new-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (single sweep)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_ONCE: "true"
        run: python ch_url_monitor.py

      - name: Save updated URL list back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json
          git diff --staged --quiet || git commit -m "Update seen URLs [skip ci]"
          git push
