name: Chrome Hearts Monitor

# Scheduling is handled entirely by an external service (cron-job.org)
# calling this workflow's dispatch endpoint on a set interval. GitHub's
# own `schedule:` trigger was removed — it fires unpredictably (can be
# delayed hours) and was adding extra, uncontrolled runs on top of the
# external trigger, which counts against your free Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-for-new-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # safety net: kill the job if it ever hangs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (single sweep)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          RUN_ONCE: "true"
          PYTHONUNBUFFERED: "1"
        run: python -u ch_url_monitor.py

      - name: Save updated URL list back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json
          git diff --staged --quiet || git commit -m "Update seen URLs [skip ci]"
          git push
